# Publish aghara-mcp to npm on version tags (mcp/v*).
# Manual alternative: cd mcp && bun publish
name: Publish MCP to npm

on:
  push:
    tags:
      - 'mcp/v*'
  workflow_dispatch:

defaults:
  run:
    working-directory: mcp

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing (no long-lived token)
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing via OIDC — no NODE_AUTH_TOKEN needed.
      # Fallback: set NPM_TOKEN repo secret and uncomment the env line.
      - run: bun publish --access public
      #  env:
      #    NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
