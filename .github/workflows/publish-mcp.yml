# Publish aghara-mcp to npm on version tags (mcp/v*).
# Manual alternative: cd mcp && bun publish
name: Publish MCP to npm

on:
  push:
    tags:
      - 'mcp/v*'
  workflow_dispatch:

defaults:
  run:
    working-directory: mcp

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing (no long-lived token)
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      # npm 11.1+ required for provenance attestations.
      - run: npm install -g npm@latest
      # Provenance via OIDC trusted publishing — no NODE_AUTH_TOKEN needed.
      # Shows "Built and signed on GitHub Actions" on the npm package page.
      # Fallback: set NPM_TOKEN repo secret and use `npm publish` with NODE_AUTH_TOKEN.
      - run: npm publish --provenance --access public
